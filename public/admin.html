<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鑫海传媒 · 管理后台</title><link rel="stylesheet" href="/style.css"><style>.admin{padding:110px 0 70px;min-height:100vh}.admin-shell{display:grid;grid-template-columns:230px 1fr;gap:35px}.sidebar{background:#151c29;padding:22px;border:1px solid #303b49;align-self:start}.sidebar button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#bec6d1;padding:14px;border-bottom:1px solid #273140}.sidebar button.active{color:var(--gold);background:#252a32}.panel{background:#151c29;border:1px solid #303b49;padding:28px;min-width:0}.panel h2{font-size:28px}.panel h3{margin-top:35px}.panel textarea{min-height:90px}.field{margin:18px 0}.field label{color:var(--muted);font-size:13px}.admin .btn{margin:18px 0}.record{padding:17px 0;border-bottom:1px solid #303b49;overflow-wrap:anywhere}.record p{color:var(--muted)}.record button,.danger{border:1px solid #9b6262;background:transparent;color:#ed9999;padding:8px 12px}.editable{padding:20px;border:1px solid #3a4654;margin:15px 0}.admin-login{width:min(420px,100%);margin:70px auto}.hidden{display:none!important}.hint{color:var(--muted);font-size:12px}.admin-counts{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.admin-counts div{background:#202a38;padding:24px}.admin-counts strong{display:block;font-size:35px;color:var(--gold)}@media(max-width:800px){.admin-shell{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto}.sidebar button{white-space:nowrap;width:auto}.admin-counts{grid-template-columns:1fr}}</style></head><body><header class="header"><a href="/" class="brand">✦ 鑫海传媒 <small>ADMIN</small></a><a href="/" class="header-cta">返回网站 ↗</a></header><main class="admin container"><section id="login" class="panel admin-login"><div class="section-tag">SECURE ADMIN LOGIN</div><h2>管理后台登录</h2><form id="loginForm"><label>账号<input name="username" value="admin" required></label><label>密码<input type="password" name="password" required></label><button class="btn primary">登录后台 ↗</button><p id="loginStatus" class="form-status"></p></form><p class="hint">密码通过服务器环境变量 ADMIN_PASSWORD 设置。</p></section><div id="workspace" class="admin-shell hidden"><aside class="sidebar" id="sidebar"><button data-tab="overview" class="active">数据概览</button><button data-tab="settings">文案与联系信息</button><button data-tab="businesses">核心业务管理</button><button data-tab="gallery">图片展示管理</button><button data-tab="jobs">招聘岗位管理</button><button data-tab="applications">简历投递</button><button data-tab="messages">留言管理</button><button id="logout">退出登录</button></aside><section class="panel"><h2 id="panelTitle">数据概览</h2><div id="panelBody"></div><p id="saveStatus" class="form-status"></p></section></div></main><script src="/admin.js"></script></body></html>
